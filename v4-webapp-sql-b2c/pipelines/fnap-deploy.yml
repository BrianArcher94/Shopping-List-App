trigger:
- none

pool:
  name: <PoolName>

variables:
  - name: appDir
    value: 'function'
  - name: functionAppName
    value: 'slab2c-dv-fnap-ukw-001'
  - name: azureSubscription
    value: '<ServiceConnection>'
  - name: nodeVersion
    value: '24'
  - name: AZP_AGENT_CLEANUP_PSMODULES_IN_POWERSHELL
    value: true

stages:
  # =========================================================
  - stage: Build
    displayName: 'Build & package functions'
    jobs:
      - job: build
        displayName: 'npm build'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'npm ci'
            workingDirectory: '$(appDir)'

          - script: npm test
            displayName: 'npm test (vitest — JWT validation)'
            workingDirectory: '$(appDir)'

          - script: npm run build
            displayName: 'npm run build (tsc → dist)'
            workingDirectory: '$(appDir)'

          - script: npm prune --omit=dev
            displayName: 'Prune dev dependencies'
            workingDirectory: '$(appDir)'

          - task: CopyFiles@2
            displayName: 'Stage deployable files'
            inputs:
              SourceFolder: '$(appDir)'
              # host.json is REQUIRED at the package root, or no functions load.
              Contents: |
                host.json
                package.json
                dist/**
                node_modules/**
              TargetFolder: '$(Build.BinariesDirectory)/fnap'

          - task: ArchiveFiles@2
            displayName: 'Zip deployment bundle'
            inputs:
              rootFolderOrFile: '$(Build.BinariesDirectory)/fnap'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/fnap.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact "fnap"'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/fnap.zip'
              artifact: 'fnap'

  # =========================================================
  - stage: Deploy
    displayName: 'Deploy to Function App'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: deploy
        displayName: 'Deploy functions'
        environment: 'dev'                  
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'fnap'

                - task: AzureFunctionApp@2
                  displayName: 'Deploy to $(functionAppName)'
                  inputs:
                    connectionType: 'AzureRM'
                    azureSubscription: '$(azureSubscription)'
                    appType: 'functionAppLinux'
                    appName: '$(functionAppName)'
                    package: '$(Pipeline.Workspace)/fnap/fnap.zip'
                    deploymentMethod: 'auto'