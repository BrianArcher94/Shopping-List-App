trigger:
- none

pool:
  name: <PoolName>

variables:

  - name: workspace
    ${{ if contains(variables['Build.DefinitionName'], 'Dev UKS') }}:
      value: dv-uks
    ${{ elseif contains(variables['Build.DefinitionName'], 'Dev UKW') }}:
          value: dv-ukw
    ${{ elseif contains(variables['Build.DefinitionName'], 'Pre-Prod UKS') }}:
      value: pp-uks
    ${{ elseif contains(variables['Build.DefinitionName'], 'Prod UKS') }}:
      value: pa-uks
    ${{ else }}:
      value: default

  - name: AZP_AGENT_CLEANUP_PSMODULES_IN_POWERSHELL
    value: true

  - name: tfDir
    value: 'terraform-identity'

  # ciamClientId and ciamClientSecret are defined on the pipeline in the ADO UI (secret flagged).


stages:

  - stage: WORKSPACE
    displayName: WORKSPACE
    jobs:
    - job: 'initiating_workspace'
      steps:
      - powershell: |
          Write-Host "A pipeline named '$(Build.DefinitionName)' means a workspace called '$(workspace)'"
        displayName: 'Display Workspace Output'

  - stage: CHECK
    displayName: CHECK
    dependsOn:
    - WORKSPACE
    condition: |
      and(succeeded(), ne(variables['workspace'], 'default'))
    jobs:
    - job: 'Cancel_Default_Workspace'
      displayName: 'Cancel Default Workspace'
      steps:
      - powershell: |
          Write-Host "A pipeline named '$(Build.DefinitionName)' means a workspace called '$(workspace)'"
        displayName: 'Display Workspace/Environment Data'

  - stage: CANCEL
    dependsOn:
    - CHECK
    condition: eq(variables['workspace'], 'default')
    displayName: CANCEL
    jobs:
    - job: 'Default_Workspace_Located'
      displayName: 'Default Workspace Located'
      steps:
      - powershell: |
          Write-Host "The pipeline has exited as workspace is default"
        displayName: 'Display Stop Message'

  - stage: PLAN
    displayName: 'PLAN'
    dependsOn:
    - CHECK
    - WORKSPACE
    condition: and(succeeded(), ne(variables['workspace'], 'default'))
    jobs:
      - job: 'Plan'
        displayName: 'Terraform Plan'
        steps:

          # The service connection authenticates the BACKEND (state, workforce tenant).
          # The azuread/msgraph PROVIDERS authenticate to the external tenant via TF_VAR_*.
          # Do not add addSpnToEnvironment or ARM_* here - see b2c-tf-plan.html section 4.
          - task: AzureCLI@3
            displayName: 'Terraform Init'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform init -upgrade

          - task: AzureCLI@3
            displayName: 'Terraform Validate'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform validate

          - task: AzureCLI@3
            displayName: 'Initialize Workspace'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                powershell -NoProfile -ExecutionPolicy Bypass -File "environments/workspace.ps1" -workspaceName "$(workspace)"

          - task: AzureCLI@3
            displayName: 'Terraform Plan'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform plan -out=tfplan
            env:
              # Secret variables are NOT exposed to scripts unless mapped explicitly
              TF_VAR_ciam_client_id: $(ciamClientId)
              TF_VAR_ciam_client_secret: $(ciamClientSecret)

  - stage: APPROVE
    displayName: 'APPROVE'
    dependsOn:
    - CHECK
    - WORKSPACE
    - PLAN
    condition: and(succeeded(), ne(variables['workspace'], 'default'))
    jobs:
    - job: 'Approve_Deployment'
      displayName: 'Request for Approval'
      pool: server
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 120
        inputs:
          notifyUsers: |
            $(Build.RequestedForEmail)
          instructions: |

            Identity (External ID) deployment - review the PLAN stage output.
            Requester Name : $(Build.RequestedFor)
            Requester Email : $(Build.RequestedForEmail)
            org Uri : $(System.CollectionUri)
            Project Name : $(System.TeamProject)
          onTimeout: 'reject'

  - stage: APPLY
    displayName: 'APPLY'
    dependsOn:
    - APPROVE
    condition: and(succeeded(), ne(variables['workspace'], 'default'))
    jobs:
    - job: 'Apply'
      displayName: 'Apply'

      steps:

          - task: AzureCLI@3
            displayName: 'Terraform Init'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform init -upgrade

          - task: AzureCLI@3
            displayName: 'Terraform Validate'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform validate

          - task: AzureCLI@3
            displayName: 'Initialize Workspace'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                powershell -NoProfile -ExecutionPolicy Bypass -File "environments/workspace.ps1" -workspaceName "$(workspace)"

          - task: AzureCLI@3
            displayName: 'Terraform Apply'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '<ServiceConnection>'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(tfDir)'
              inlineScript: |
                terraform plan -out=tfplan
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                terraform apply -auto-approve tfplan
            env:
              TF_VAR_ciam_client_id: $(ciamClientId)
              TF_VAR_ciam_client_secret: $(ciamClientSecret)