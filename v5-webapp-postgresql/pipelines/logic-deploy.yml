trigger:
  - none

pool:
  name: <PoolName>

variables:
  # The Logic App project root (where host.json lives), not logic/ itself:
  # the zip needs host.json at its root and each workflow one folder down.
  - name: appDir
    value: 'logic/shopping-list-workflow/shopping-list'
  - name: logicAppName
    value: 'slapgsql-dv-lgaps-ukw-001'
  - name: azureSubscription
    value: '<ServiceConnection>'
  - name: AZP_AGENT_CLEANUP_PSMODULES_IN_POWERSHELL
    value: true

stages:
  # =========================================================
  - stage: Package
    displayName: 'Package workflow'
    jobs:
      - job: package
        displayName: 'Collect & zip'
        steps:
          - task: CopyFiles@2
            displayName: 'Stage deployable files'
            inputs:
              SourceFolder: '$(appDir)'
              # host.json + connectors + every workflow folder. No build, no node_modules.
              Contents: |
                host.json
                connections.json
                parameters.json
                **/workflow.json
              TargetFolder: '$(Build.BinariesDirectory)/logic'

          - task: ArchiveFiles@2
            displayName: 'Zip deployment bundle'
            inputs:
              rootFolderOrFile: '$(Build.BinariesDirectory)/logic'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/logic.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact "logic"'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/logic.zip'
              artifact: 'logic'

  # =========================================================
  - stage: Deploy
    displayName: 'Deploy to Logic App'
    dependsOn: Package
    condition: succeeded()
    jobs:
      - deployment: deploy
        displayName: 'Deploy workflow'
        environment: 'dev'                  
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'logic'

                - task: AzureFunctionApp@2
                  displayName: 'Deploy to $(logicAppName)'
                  inputs:
                    connectionType: 'AzureRM'
                    azureSubscription: '$(azureSubscription)'
                    appType: 'functionApp'         
                    appName: '$(logicAppName)'
                    package: '$(Pipeline.Workspace)/logic/logic.zip'
                    deploymentMethod: 'zipDeploy'